[project]
name = "ai-video-studio-server"
version = "0.1.0"
description = "无限画布 AI 视频创作工作台 - 后端服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.12",
    "websockets>=13",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pypdf>=4.0",  # 剧本文档上传解析（PDF 文本提取）
]

[project.optional-dependencies]
# GPU 推理依赖（M0 阶段可选安装，未安装时以 mock 模式运行）
inference = [
    "torch>=2.5",
    "diffusers>=0.33",
    "transformers>=4.48",
    "accelerate>=1.2",  # model/sequential cpu offload 必需
    "safetensors>=0.4",
    "sentencepiece>=0.2",  # Qwen 分词器需要
    "einops>=0.8",  # HiDream-O1 官方采样管线需要
    "scipy>=1.10",  # HiDream flash/unipc 调度器可选依赖
    "httpx>=0.27",  # LLM/provider 调用客户端（基础依赖已含，推理组显式声明）
    "opencv-python>=4.9",  # diffusers export_to_video 视频导出需要
]
tts = [
    "edge-tts>=6.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
# 仅打包 app 包（data/models 为运行期目录，勿打包）
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
